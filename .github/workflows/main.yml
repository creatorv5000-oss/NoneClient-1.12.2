name: Build NoneClient

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Make Gradle executable
      run: chmod +x gradlew

    - name: Build
      run: ./gradlew compileJava --no-daemon

    - name: Make EPK
      run: echo "Making EPK..."

    - name: Build JavaScript
      run: ./gradlew teavmCompileJS --no-daemon

    - name: Make Offline Client
      run: echo "Making Offline Client..."

    - name: Upload NoneClient
      uses: actions/upload-artifact@v4
      with:
        name: NoneClient-Build
        path: javascript/
        retention-days: 5
